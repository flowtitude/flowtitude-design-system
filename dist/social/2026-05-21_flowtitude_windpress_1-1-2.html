<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brand: #ff9900;
    --brand-dark: #cc7a00;
    --bg-dark: #12100a;
    --text-white: #f8fafc;
    --text-muted: #94a3b8;
    --accent-blue: #3b82f6;
    --accent-purple: #a855f7;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-dark);
    width: 1200px;
    height: 675px;
    overflow: hidden;
  }

  .card {
    width: 1200px;
    height: 675px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 64px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 94% 8%, rgba(255, 151, 0, 0.34) 0%, transparent 43%),
      radial-gradient(circle at 8% 92%, rgba(168, 85, 247, 0.22) 0%, transparent 38%),
      radial-gradient(circle at 55% 48%, rgba(59, 130, 246, 0.12) 0%, transparent 64%),
      linear-gradient(135deg, rgba(255, 153, 0, 0.08), transparent 42%);
    z-index: 0;
  }

  .card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 60%, transparent 100%);
    z-index: 2;
  }

  .card > * { position: relative; z-index: 1; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: rgba(168, 85, 247, 0.16);
    color: var(--accent-purple);
    border: 1px solid rgba(168, 85, 247, 0.34);
  }

  .badge-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-area img {
    height: 50px;
    width: auto;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 940px;
  }

  .eyebrow {
    color: var(--brand);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .title {
    font-size: 54px;
    font-weight: 800;
    color: var(--text-white);
    line-height: 1.12;
    margin-bottom: 22px;
    letter-spacing: -0.02em;
  }

  .highlight {
    color: #f8fafc;
    font-weight: 800;
    background: linear-gradient(135deg, #ff9900, #ffbd4a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: brightness(1.12);
  }

  .subtitle {
    font-size: 23px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.44;
    max-width: 860px;
  }

  .code-block {
    margin-top: 30px;
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid rgba(255, 151, 0, 0.25);
    border-left: 3px solid var(--brand);
    border-radius: 12px;
    padding: 19px 24px;
    font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 17px;
    color: var(--text-muted);
    width: fit-content;
    max-width: 860px;
  }

  .code-block .old {
    color: #94a3b8;
  }

  .code-block .new {
    color: #f8fafc;
    font-weight: 700;
  }

  .code-block .arrow {
    color: var(--brand);
    margin: 0 10px;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .tags {
    display: flex;
    gap: 12px;
  }

  .tag {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 6px 14px;
    border-radius: 6px;
  }

  .author {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .author-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brand);
  }

  .accent-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--brand) 0%, var(--brand) 40%, var(--brand-dark) 70%, transparent 100%);
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="badge">
      <span class="badge-icon">*</span>
      Design System
    </div>
    <div class="logo-area">
      <img src="file:///Volumes/Disco SSD/Desarrollo/clientes/soluciones-abiertas/ops/public/assets/flowtitude/social/logo-flowtitude.svg" alt="Flowtitude">
    </div>
  </div>

  <div class="content">
    <div class="eyebrow">Flowtitude 1.1.2</div>
    <h1 class="title">Nueva version WindPress 1.1.2</h1>
    <p class="subtitle">Fallbacks para tipografia y espacios fluidos.</p>
    <div class="code-block">
      <span class="old">src/windpress</span>
      <span class="arrow">→</span>
      <span class="new">flowtitude-1.1.2.windpress</span>
    </div>
  </div>

  <div class="bottom">
    <div class="tags">
      <span class="tag">#Flowtitude</span>
      <span class="tag">#WindPress</span>
      <span class="tag">#DesignSystem</span>
    </div>
    <div class="author">
      <span class="author-dot"></span>
      flowtitude.com
    </div>
  </div>

  <div class="accent-line"></div>
</div>
</body>
</html>
